name: Cleanup demo files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Remove template demo files
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch _publications/2010-10-01-paper-title-number-2.md _publications/2015-10-01-paper-title-number-3.md _publications/2024-02-17-paper-title-number-4.md _publications/2025-06-08-paper-title-number-5.md
          git rm -q --ignore-unmatch _talks/2012-03-01-talk-1.md _talks/2014-02-01-talk-2.md _talks/2014-03-01-talk-3.md
          git rm -q --ignore-unmatch _teaching/2014-spring-teaching-1.md _teaching/2015-spring-teaching-2.md
          git rm -q --ignore-unmatch _portfolio/portfolio-1.md _portfolio/portfolio-2.html
          git rm -q --ignore-unmatch _posts/2012-08-14-blog-post-1.md _posts/2013-08-14-blog-post-2.md _posts/2014-08-14-blog-post-3.md _posts/2015-08-14-blog-post-4.md _posts/2199-01-01-future-post.md
          git rm -q --ignore-unmatch _pages/archive-layout-with-content.md _pages/category-archive.html _pages/collection-archive.html _pages/cv-json.md _pages/cv.md _pages/markdown.md _pages/non-menu-page.md _pages/page-archive.html _pages/portfolio.html _pages/sitemap.md _pages/tag-archive.html _pages/talkmap.html _pages/talks.html _pages/teaching.html _pages/terms.md _pages/year-archive.html
          git rm -q --ignore-unmatch _data/cv.json _drafts/post-draft.md
          git rm -q --ignore-unmatch files/bibtex1.bib files/paper1.pdf files/paper2.pdf files/paper3.pdf files/slides1.pdf files/slides2.pdf files/slides3.pdf
          git rm -r -q --ignore-unmatch talkmap
          if git diff --cached --quiet; then
            echo "Nothing to delete."
          else
            git commit -m "Remove template demo files and pages"
            git push
          fi
