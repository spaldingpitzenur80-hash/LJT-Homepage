name: Cleanup demo files 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Remove remaining template demo tooling
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -r -q --ignore-unmatch markdown_generator
          git rm -r -q --ignore-unmatch scripts
          git rm -q --ignore-unmatch talkmap.py talkmap.ipynb talkmap_out.ipynb
          git rm -q --ignore-unmatch _data/authors.yml
          if git diff --cached --quiet; then
            echo "Nothing to delete."
          else
            git commit -m "Remove template demo tooling and sample data"
            git push
          fi
