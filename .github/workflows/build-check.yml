name: Build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Inspect build output
        run: |
          ls _site
          test -f _site/index.html
          test -f _site/publications/index.html
          grep -q "Junteng Liu" _site/index.html
          grep -q "SynLogic" _site/publications/index.html
          if grep -rq "Paper Title Number" _site; then echo "Found leftover demo content"; exit 1; fi
          echo "Build output verified."
